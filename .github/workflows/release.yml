# Builds the Android app and publishes it as a GitHub release. Runs only when started by hand
# (Actions, then Release, then Run workflow), never on a push.
#
# The APK is signed with Expo's standard debug key (the one `npx expo prebuild` writes), so it installs
# straight onto a phone and Google sign-in works with the Android client already registered for that
# key. It can't go on Google Play; that needs a release key (see README).

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.1.0)
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - run: npm ci

      # The public keys the app is built with (they're baked into the app, as on the website).
      - name: Write .env
        run: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}"
            echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"
            echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}"
          } > .env

      - run: npx expo prebuild --platform android --no-install

      # 64-bit phones only: every phone from the last several years, and a far quicker build.
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "bredbord-$VERSION.apk"
          gh release create "v$VERSION" "bredbord-$VERSION.apk" \
            --title "Bredbord $VERSION" \
            --notes "Android app, for 64-bit phones. Download the APK on your phone and open it to install (allow installs from your browser when asked)." \
            --target "$GITHUB_SHA"
